name: Deploy Owen's Fitness
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
          run_install: false
      - name: Instalar, verificar y compilar
        run: |
          pnpm install --frozen-lockfile
          pnpm exec tsc --noEmit
          pnpm test:permissions
          python3 -m unittest discover -s tests -p 'test_demo.py' -v
          pnpm build
          pnpm test:http
      - name: Preparar paquete
        run: tar -czf "$RUNNER_TEMP/owens-build.tar.gz" .next/standalone .next/static public
      - uses: actions/upload-artifact@v4
        with:
          name: owens-build
          path: ${{ runner.temp }}/owens-build.tar.gz
          if-no-files-found: error
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: [self-hosted, linux, ARM64]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: owens-build
          path: ${{ runner.temp }}/owens-build
      - name: Publicar en Raspberry
        run: |
          tar -xzf "$RUNNER_TEMP/owens-build/owens-build.tar.gz" -C "$RUNNER_TEMP/owens-build"
          test -f "$RUNNER_TEMP/owens-build/.next/standalone/server.js"
          sudo /usr/bin/systemctl stop owens-fitness
          mkdir -p /home/sp/apps/OwensFitness
          rsync -a --delete --exclude='.env' --exclude='.git' --exclude='data/' --exclude='actions-runner/' --exclude='node_modules/' --exclude='.next/' ./ /home/sp/apps/OwensFitness/
          mkdir -p /home/sp/apps/OwensFitness/.next/standalone
          rsync -a --delete "$RUNNER_TEMP/owens-build/.next/standalone/" /home/sp/apps/OwensFitness/.next/standalone/
          rsync -a "$RUNNER_TEMP/owens-build/.next/static/" /home/sp/apps/OwensFitness/.next/standalone/.next/static/
          rsync -a "$RUNNER_TEMP/owens-build/public/" /home/sp/apps/OwensFitness/.next/standalone/public/
          sudo /usr/bin/systemctl start owens-fitness
          curl --fail --silent --show-error --retry 10 --retry-delay 2 --retry-connrefused http://127.0.0.1:3012/OwensFitness/login > /dev/null
